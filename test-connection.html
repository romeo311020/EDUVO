<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اختبار الاتصال - EDUVO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #060b19;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 14px;
            padding: 30px;
        }
        h1 { margin-bottom: 20px; text-align: center; }
        .test-item {
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid;
            background: rgba(255,255,255,0.05);
        }
        .pending { border-left-color: #f59e0b; }
        .success { border-left-color: #10b981; background: rgba(16, 185, 129, 0.1); }
        .error { border-left-color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .label { font-weight: bold; }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #1c72d8;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }
        button:hover { background: #00d2ff; color: black; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .info { 
            background: rgba(59, 130, 246, 0.1); 
            border: 1px solid #3b82f6;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 0.9rem;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <h1>🧪 اختبار الاتصال بـ Supabase</h1>
        
        <div class="info">
            <strong>ℹ️ اضغط الزر الأزرق أدناه لاختبار الاتصال</strong>
        </div>
        
        <div id="tests"></div>
        
        <button id="testBtn" onclick="runAllTests()">🔄 اختبر الاتصال</button>
    </div>

    <script>
        const SUPABASE_URL = "https://mjptrjidrhwaphkmqoma.supabase.co";
        const SUPABASE_KEY = "sb_publishable_CwN4jvLvXRTEu5uimUsIzA_ob8h8DAS";
        
        let db = null;
        const results = {};

        function addTest(label, status, message = '') {
            const testsDiv = document.getElementById('tests');
            const div = document.createElement('div');
            div.className = `test-item ${status}`;
            
            let icon = '⏳';
            if (status === 'success') icon = '✅';
            if (status === 'error') icon = '❌';
            
            div.innerHTML = `<span class="label">${icon} ${label}</span>`;
            if (message) div.innerHTML += `<br><small>${message}</small>`;
            
            testsDiv.appendChild(div);
            testsDiv.scrollTop = testsDiv.scrollHeight;
        }

        async function runAllTests() {
            console.log('بدء الاختبارات...');
            
            const testBtn = document.getElementById('testBtn');
            testBtn.disabled = true;
            testBtn.innerText = '⏳ جاري الاختبار...';
            
            const testsDiv = document.getElementById('tests');
            testsDiv.innerHTML = '';
            results = {};

            // Test 1: مكتبة Supabase
            addTest('1️⃣ تحميل مكتبة Supabase', 'pending');
            console.log('اختبار 1: Supabase Library');
            try {
                if (window.supabase) {
                    addTest('1️⃣ تحميل مكتبة Supabase', 'success', '✅ تم التحميل');
                    results.supabaseLoaded = true;
                    console.log('✅ مكتبة Supabase محملة');
                } else {
                    addTest('1️⃣ تحميل مكتبة Supabase', 'error', '❌ لم تحمّل');
                    results.supabaseLoaded = false;
                    console.log('❌ Supabase لم تحمّل');
                }
            } catch (e) {
                addTest('1️⃣ تحميل مكتبة Supabase', 'error', '❌ ' + e.message);
                console.error('خطأ:', e);
            }

            // Test 2: الاتصال بـ Supabase
            addTest('2️⃣ الاتصال بـ Supabase', 'pending');
            console.log('اختبار 2: إنشاء Client');
            try {
                db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                addTest('2️⃣ الاتصال بـ Supabase', 'success', '✅ تم الاتصال');
                results.dbConnected = true;
                console.log('✅ تم إنشاء Supabase Client');
            } catch (e) {
                addTest('2️⃣ الاتصال بـ Supabase', 'error', '❌ ' + e.message);
                results.dbConnected = false;
                console.error('خطأ:', e);
                testBtn.disabled = false;
                testBtn.innerText = '🔄 اختبر الاتصال';
                return;
            }

            // Test 3: جدول Profiles
            addTest('3️⃣ وجود جدول Profiles', 'pending');
            console.log('اختبار 3: جدول Profiles');
            try {
                const { data, error } = await db.from('profiles').select('count');
                if (error) {
                    addTest('3️⃣ وجود جدول Profiles', 'error', '❌ ' + error.message);
                    results.tableExists = false;
                    console.error('❌ خطأ الجدول:', error);
                } else {
                    addTest('3️⃣ وجود جدول Profiles', 'success', '✅ الجدول موجود');
                    results.tableExists = true;
                    console.log('✅ جدول Profiles موجود');
                }
            } catch (e) {
                addTest('3️⃣ وجود جدول Profiles', 'error', '❌ ' + e.message);
                results.tableExists = false;
                console.error('خطأ:', e);
            }

            // Test 4: بيانات Admin
            addTest('4️⃣ بيانات Admin في Profiles', 'pending');
            console.log('اختبار 4: بيانات Admin');
            try {
                const { data, error } = await db
                    .from('profiles')
                    .select('*')
                    .eq('email', 'admin@eduvo.eg')
                    .single();
                
                if (error) {
                    addTest('4️⃣ بيانات Admin في Profiles', 'error', '❌ ' + error.message);
                    results.adminInProfiles = false;
                    console.error('❌ خطأ:', error);
                } else if (!data) {
                    addTest('4️⃣ بيانات Admin في Profiles', 'error', '❌ لا توجد بيانات Admin');
                    results.adminInProfiles = false;
                    console.log('❌ لا توجد بيانات Admin');
                } else {
                    addTest('4️⃣ بيانات Admin في Profiles', 'success', `✅ الدور: ${data.role}`);
                    results.adminInProfiles = true;
                    console.log('✅ بيانات Admin موجودة:', data);
                }
            } catch (e) {
                addTest('4️⃣ بيانات Admin في Profiles', 'error', '❌ ' + e.message);
                results.adminInProfiles = false;
                console.error('خطأ:', e);
            }

            // ملخص النتائج
            setTimeout(() => {
                console.log('نتائج الاختبار:', results);
                if (results.tableExists && results.adminInProfiles) {
                    addTest('✅ النتيجة النهائية', 'success', '✅ كل شيء تمام! يمكنك الآن استخدام admin.html');
                } else {
                    addTest('⚠️ النتيجة النهائية', 'error', '❌ هناك مشاكل - اتبع SQL_SETUP.md');
                }
                testBtn.disabled = false;
                testBtn.innerText = '🔄 اختبر الاتصال';
            }, 500);
        }

        // تحذير عند التحميل
        window.addEventListener('DOMContentLoaded', () => {
            console.log('✅ الصفحة تم تحميلها');
            console.log('اضغط الزر الأزرق لبدء الاختبار');
        });
    </script>
</body>
</html>
