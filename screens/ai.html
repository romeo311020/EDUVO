<div class="assistant-panel">
  <div class="assistant-header">
    <div>
      <span class="assistant-badge">EDUVO AI</span>
      <h2>المساعد الذكي</h2>
    </div>
    <span class="assistant-status">متصل الآن</span>
  </div>

  <div class="assistant-meta">
    <span>شرح سريع</span>
    <span>حل تمرين</span>
    <span>خطة مراجعة</span>
  </div>

  <div class="chat-container" id="chat-box">
    <div class="chat-bubble chat-ai">أهلاً بك! أنا EDUVO AI، أستطيع أن أشرح لك المفاهيم، أساعد في المسائل، وأجهز لك خطة مراجعة في دقائق.</div>
  </div>

  <div class="ai-suggestions" aria-label="أسئلة مقترحة">
    <button type="button" class="ai-suggestion" data-ai-prompt="اشرح لي قانون نيوتن الثاني بمثال">اشرح قانون نيوتن الثاني</button>
    <button type="button" class="ai-suggestion" data-ai-prompt="حل المعادلة 2س + 4 = 10">حل معادلة</button>
    <button type="button" class="ai-suggestion" data-ai-prompt="اعمل لي خطة مراجعة للرياضيات">خطة مراجعة</button>
    <button type="button" class="ai-suggestion" data-ai-prompt="ما الفرق بين الرابطة الأيونية والتساهمية؟">قارن بين مفهومين</button>
  </div>

  <div class="assistant-input-wrap">
    <input id="ai-input" type="text" class="input-control" placeholder="اكتب سؤالك هنا..." />
    <button type="button" id="send-ai" class="btn-primary">إرسال</button>
  </div>
</div>
